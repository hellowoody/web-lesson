<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" >
        <title>复合选择器-兄弟选择器</title>
        <style>
            .p1 {
                color:red;
            }
            /* .p1 后面所有兄弟节点 */
            .p1 ~ .p2 {
                color:blue;
            }
        </style>
    </head>
    <body>
        <h1 class="p2">零</h1>
        <div class="p1">一</div>
        <span class="p2">二</span>
        <p class="p2">三</p>
    </body>
</html>
