<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>复合选择器-后代选择器</title>
        <style>
            /* p1 必须从属于li标签下的内容文字变成红色 */
            li .p1 {
                color:red;
            }

        </style>
    </head>
    <body>
        <ul>
            <li>
                <div class="p1">hello</div>
            </li>
            <li class="p1">世界</li>
            <li>
                <div>
                    <ol>
                        <li class="p1">张三</li>
                        <li>王武</li>
                    </ol>
                </div>
            </li>
        </ul>

        <div id="id01">123</div>
        <!-- 再次强调 id 不能重复 -->
        <div id="id01">456</div>
    </body>
</html>
<script>
const redFonts = document.querySelectorAll("li .p1")
console.log(redFonts) // [] 

const redFont = document.querySelector("li .p1")
console.log(redFont)


const d1 = document.getElementById("#id01")     // div
// 虽然页面上有两个id叫id01的 但是只能拿到第一个id01的标签
console.log(d1) 
</script>
